version: '3.1'
services:
  web:
    image: php:8.1-apache
    container_name: ci4-web
    volumes:
      - .:/var/www/html
    ports:
      - "8081:80"
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: ci4-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ci4db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
